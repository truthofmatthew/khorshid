<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>خورشید</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="28" height="28">
    <h1>خورشید</h1>
    <p id="status" class="status" role="status">…</p>
  </header>
  <a class="primary" id="open-notion" href="https://www.notion.so/" target="_blank" hidden>نوشن رو باز کن</a>

  <section aria-labelledby="h-dates">
    <h2 id="h-dates">تاریخ</h2>
    <label class="row"><span>تاریخ شمسی تو نوشن</span><input type="checkbox" role="switch" data-key="jalali"></label>
    <label class="row"><span>عددها فارسی باشن <small>۱۴۰۵ به‌جای 1405</small></span><input type="checkbox" role="switch" data-key="faDigits"></label>
    <fieldset class="row">
      <legend>تاریخ چه شکلی باشه؟</legend>
      <div class="seg">
        <label><input type="radio" name="style" value="auto"><span>مثل نوشن</span></label>
        <label><input type="radio" name="style" value="numeric"><span>۱۴۰۵/۰۸/۱۱</span></label>
        <label><input type="radio" name="style" value="long"><span>۱۱ آبان ۱۴۰۵</span></label>
      </div>
    </fieldset>
    <label class="row"><span>تاریخ رو شمسی تایپ کنم <small>بنویس ۱۴۰۵/۸/۱۱ و Enter بزن</small></span><input type="checkbox" role="switch" data-key="jalaliInput"></label>
  </section>

  <section aria-labelledby="h-text">
    <h2 id="h-text">متن</h2>
    <label class="row"><span>راست‌چین خودکار <small>هر پاراگراف جهت خودش رو پیدا می‌کنه</small></span><input type="checkbox" role="switch" data-key="direction"></label>
    <label class="row"><span>فونت فارسی</span>
      <select id="font"><option value="">دست نزن</option></select>
    </label>
    <p class="hint">کیبورد انگلیسی بود؟ متن رو انتخاب کن و <span dir="ltr"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd></span> بزن، «sghl» می‌شه «سلام». <span dir="ltr"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd></span> هم «ي» و «ك» عربی و نیم‌فاصله رو درست می‌کنه. با کلیک راست هم می‌شه.</p>
  </section>

  <section id="site" hidden aria-labelledby="h-site">
    <h2 id="h-site">همین سایت</h2>
    <p class="hint" id="site-text"></p>
    <button id="site-btn" class="secondary" type="button"></button>
  </section>

  <a class="primary" id="add-calendar" href="https://truthofmatthew.com/projects/khorshid/calendar/fa/" target="_blank">یه تقویم شمسی بذار تو نوشن</a>

  <footer>
    <a href="https://github.com/truthofmatthew/khorshid/issues" target="_blank">یه چیزی خرابه؟</a>
    <a href="welcome.html" id="guide">راهنما</a>
    <span id="version"></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
