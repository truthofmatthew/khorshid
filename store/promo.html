<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Vazirmatn"; src: url("/dist/extension/fonts/Vazirmatn.woff2") format("woff2"); font-weight: 100 900; }
/* Drawn at 2x (880x560) and scaled down to the store's 440x280. */
body { margin: 0; zoom: 2; }
.tile { position: fixed; left: 0; top: 0; width: 440px; height: 280px; background: #b5452f; color: #fff; font-family: "Vazirmatn", sans-serif; display: grid; grid-template-columns: 1fr 150px; align-items: center; padding: 0 28px; box-sizing: border-box; gap: 18px; }
h1 { margin: 0; font-size: 46px; font-weight: 900; line-height: 1.1; }
p { margin: 8px 0 0; font-size: 17px; line-height: 1.6; opacity: .92; }
.cal { background: #fff; color: #37352f; border-radius: 14px; text-align: center; padding: 10px 0 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.cal .w { font-size: 14px; color: #787774; }
.cal .d { font-size: 64px; font-weight: 900; line-height: 1.05; color: #b5452f; }
.cal .m { font-size: 18px; font-weight: 700; }
</style></head>
<body><div class="tile">
  <div><img src="/public/icons/icon.svg" width="52" height="52" alt=""><h1>خورشید</h1><p>تاریخ شمسی و فونت فارسی<br>برای نوشن و وب</p></div>
  <div class="cal"><div class="w">دوشنبه</div><div class="d">۱۱</div><div class="m">آبان ۱۴۰۵</div></div>
</div></body></html>
